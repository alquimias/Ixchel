# Crea y publica @alquimias/erp-ui en GitHub Packages sin pasar por
# el CI del monorepo. El manifiesto del repo sigue llamándose @erp/ui
# y private: GitHub Packages solo acepta el scope de la organización,
# así que este job renombra el paquete en el runner antes de publicar.
# En main publica 0.0.1-sha<12>. Un tag v* publica esa versión y abre
# un GitHub Release con el .tgz.
name: Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@alquimias'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Preparar manifiesto de publicación
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.1-sha${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >> "$GITHUB_ENV"
          npm pkg set name='@alquimias/erp-ui' version="$version"
          npm pkg delete private

      - name: Empaquetar
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Subir tarball
        uses: actions/upload-artifact@v4
        with:
          name: erp-ui-${{ github.sha }}
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publicar en GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tarball="$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && npm view "@alquimias/erp-ui@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Ya publicada: @alquimias/erp-ui@${version}"
            exit 0
          fi
          publish_args=(--access restricted --registry https://npm.pkg.github.com)
          if [[ "$version" == *-* ]]; then
            publish_args+=(--tag dev)
          fi
          npm publish "$tarball" "${publish_args[@]}"

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)"
          gh release create "$GITHUB_REF_NAME" "$tarball" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Paquete @alquimias/erp-ui ${GITHUB_REF_NAME}."

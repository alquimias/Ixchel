# Publica @alquimias/erp-ui. El manifiesto del repo sigue llamándose @erp/ui
# (el workspace del ERP lo consume así); el job renombra a @alquimias/erp-ui
# en el runner. Un tag v* publica esa versión; un push a main publica
# 0.0.1-sha<12>. Destinos: npmjs.org (público, necesita NPM_TOKEN) y
# GitHub Packages (el ERP que ya lo consume ahí).
name: Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@alquimias'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Preparar manifiesto de publicación
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.1-sha${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >> "$GITHUB_ENV"
          npm pkg set name='@alquimias/erp-ui' version="$version" license=MIT
          npm pkg delete private
          npm pkg set publishConfig.access=public
          npm pkg delete publishConfig.registry || true

      - name: Empaquetar
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Subir tarball
        uses: actions/upload-artifact@v4
        with:
          name: erp-ui-${{ github.sha }}
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publicar en npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN no configurado; se omite npmjs.org"
            exit 0
          fi
          tarball="$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && npm view "@alquimias/erp-ui@${version}" version >/dev/null 2>&1; then
            echo "Ya publicada en npmjs: @alquimias/erp-ui@${version}"
            exit 0
          fi
          publish_args=(--access public --registry https://registry.npmjs.org)
          if [[ "$version" == *-* ]]; then
            publish_args+=(--tag dev)
          fi
          npm publish "$tarball" "${publish_args[@]}"

      - name: Publicar en GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tarball="$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && npm view "@alquimias/erp-ui@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Ya publicada en GitHub Packages: @alquimias/erp-ui@${version}"
            exit 0
          fi
          publish_args=(--access public --registry https://npm.pkg.github.com)
          if [[ "$version" == *-* ]]; then
            publish_args+=(--tag dev)
          fi
          npm publish "$tarball" "${publish_args[@]}"

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)"
          gh release create "$GITHUB_REF_NAME" "$tarball" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Paquete @alquimias/erp-ui ${GITHUB_REF_NAME}."
